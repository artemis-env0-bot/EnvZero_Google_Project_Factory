settings:
  # Google Project Factory Workflow | artem@env0
  # version = v2.0.0s
  environmentRemovalStrategy: detach

environments:
  wf00-project:
    name: WF-00 GCP Project
    templateName: artem_simulation_gcp_project
    revision: v2.0.0s
    workspace: wf00-v200s-rebuild01-gcp-project
    requiresApproval: false

  wf00-network:
    name: WF-00 GCP Network
    templateName: artem_simulation_gcp_network
    revision: v2.0.0s
    workspace: wf00-v200s-rebuild01-gcp-network
    requiresApproval: false
    needs:
      - wf00-project

  wf00-bucket:
    name: WF-00 GCP Bucket
    templateName: artem_simulation_gcp_bucket
    revision: v2.0.0s
    workspace: wf00-v200s-rebuild01-gcp-bucket
    requiresApproval: false
    needs:
      - wf00-project

  wf00-virtual-machine:
    name: WF-00 GCP Virtual Machine
    templateName: artem_simulation_gcp_virtual_machine
    revision: v2.0.0s
    workspace: wf00-v200s-rebuild01-gcp-virtual-machine
    requiresApproval: false
    needs:
      - wf00-network

  wf00-persistent-disk:
    name: WF-00 GCP Persistent Disk
    templateName: artem_simulation_gcp_persistent_disk
    revision: v2.0.0s
    workspace: wf00-v200s-rebuild01-gcp-persistent-disk
    requiresApproval: false
    needs:
      - wf00-virtual-machine

  wf00-gke-rebuild02:
    name: WF-00 GCP GKE Rebuild 02
    templateName: artem_simulation_gcp_gke
    revision: v2.0.0s
    workspace: wf00-v200s-rebuild02-gcp-gke
    requiresApproval: false
    needs:
      - wf00-network
